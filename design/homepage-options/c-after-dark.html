<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option C — After Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#17171f; --ink:#f4f1ea; --yellow:#ffd23f; --coral:#ff6b6b; --aqua:#3ddcc8; --blue:#5b7cff; --pink:#ff8fd1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif; }
  .page { position:relative; overflow:hidden; }
  .wrap { position:relative; z-index:2; max-width:1240px; margin:0 auto; padding:0 64px; }
  header { display:flex; justify-content:flex-end; gap:32px; padding:36px 0; font-size:16px; font-weight:600; letter-spacing:.02em; }
  header a { color:var(--ink); text-decoration:none; }
  header a:first-child { color:var(--yellow); }
  .hero { position:relative; padding:170px 0 400px; }
  h1 { font-family:'Syne', sans-serif; font-weight:800; font-size:clamp(60px, 10vw, 148px); line-height:.86; letter-spacing:-.03em; margin:0; }
  h1 span { display:block; }
  h1 span + span { color:transparent; -webkit-text-stroke:3px var(--ink); margin-left:.9em; }
  .posts { padding:0 0 160px; }
  .posts h2 { font-family:'Syne'; font-weight:800; font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:var(--aqua); margin:0 0 12px; }
  .posts ol { list-style:none; margin:0; padding:0; counter-reset:p; }
  .posts li { counter-increment:p; display:grid; grid-template-columns:90px 1fr auto; align-items:baseline; gap:24px; padding:30px 0; border-top:2px solid #3a3a46; }
  .posts li::before { content:'0' counter(p); font-family:'Syne'; font-weight:800; font-size:22px; color:var(--yellow); }
  .posts li:nth-child(2)::before { color:var(--coral); } .posts li:nth-child(3)::before { color:var(--aqua); }
  .posts a { color:var(--ink); text-decoration:none; font-family:'Syne'; font-weight:800; font-size:clamp(22px, 2.4vw, 32px); letter-spacing:-.01em; }
  .posts time { color:#a9a6b2; font-size:15px; }
  footer { display:flex; justify-content:space-between; padding:28px 0 40px; font-size:14px; color:#a9a6b2; border-top:2px solid #3a3a46; }
  footer a { color:#a9a6b2; }
  .d { position:absolute; z-index:1; overflow:visible; }
  .s { stroke:var(--ink); stroke-width:3.5; stroke-linejoin:round; stroke-linecap:round; }
</style>
</head>
<body>
<div class="page">
  <!-- shapes bleed off the page edges -->
  <svg class="d s" style="width:330px; left:150px; top:470px; transform:rotate(-6deg)" viewBox="0 0 100 85"><path d="M50 4 96 81H4Z" fill="var(--yellow)"/></svg>
  <svg class="d s" style="width:360px; right:-170px; top:110px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--coral)"/></svg>
  <svg class="d" style="width:220px; right:90px; top:420px" viewBox="0 0 100 100"><defs><pattern id="dC" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.8" fill="var(--ink)"/></pattern></defs><circle cx="50" cy="50" r="50" fill="url(#dC)"/></svg>
  <svg class="d s" style="width:440px; right:-60px; top:700px; transform:rotate(8deg)" viewBox="0 0 220 50"><path d="M5 25q13.75-22 27.5 0t27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0" fill="none" stroke="var(--aqua)" stroke-width="9"/></svg>
  <svg class="d s" style="width:180px; left:-70px; top:180px; transform:rotate(30deg)" viewBox="0 0 100 50"><path d="M4 46a46 46 0 0 1 92 0Z" fill="var(--blue)"/></svg>
  <svg class="d s" style="width:70px; left:58%; top:250px" viewBox="0 0 40 40"><path d="M20 4v32M4 20h32" fill="none" stroke="var(--pink)" stroke-width="7"/></svg>
  <svg class="d s" style="width:140px; left:-20px; top:1180px; transform:rotate(-10deg)" viewBox="0 0 140 60"><path d="m8 50 20-40 20 40 20-40 20 40 20-40 20 40" fill="none" stroke="var(--pink)" stroke-width="7"/></svg>
  <svg class="d s" style="width:110px; right:-30px; top:1380px" viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" fill="var(--yellow)" transform="rotate(20 50 50)"/></svg>
  <svg class="d" style="width:18px; left:35%; top:120px" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="var(--aqua)"/></svg>
  <svg class="d" style="width:14px; left:62%; top:620px" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="var(--yellow)"/></svg>

  <div class="wrap">
    <header><a href="#">Writing</a><a href="#">About</a></header>
    <section class="hero"><h1><span>Barnaby</span><span>Bishop</span></h1></section>
    <section class="posts">
      <h2>Writing</h2>
      <ol>
        <li><a href="#">Notes on building a tiny agent runtime</a><time>12 Nov 2026</time></li>
        <li><a href="#">An interactive example</a><time>30 Oct 2026</time></li>
        <li><a href="#">Why my homepage has a triangle on it</a><time>14 Sep 2026</time></li>
      </ol>
    </section>
    <footer><span>© 2026 Barnaby Bishop</span><a href="#">RSS</a></footer>
  </div>
</div>
</body>
</html>
