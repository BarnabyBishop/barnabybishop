<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option D — Black, White &amp; Pop</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#ffffff; --ink:#0d0d0d; --red:#ff3d6e; --yellow:#ffe14a; --blue:#2a5cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Archivo', system-ui, sans-serif; font-stretch:100%; }
  .page { position:relative; overflow:hidden; }
  .wrap { position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:0 64px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:30px 0; font-weight:700; font-size:16px; text-transform:uppercase; letter-spacing:.08em; border-bottom:4px solid var(--ink); }
  header nav { display:flex; gap:28px; }
  header a { color:var(--ink); text-decoration:none; }
  header .bb { font-stretch:125%; font-weight:900; letter-spacing:0; font-size:22px; }
  .hero { position:relative; height:760px; }
  h1 { position:relative; z-index:2; font-weight:900; font-stretch:125%; font-size:clamp(64px, 10.4vw, 150px); line-height:.9; letter-spacing:-.035em; margin:0; padding-top:120px; text-transform:uppercase; }
  h1 span { display:block; width:max-content; }
  h1 span + span { background:var(--yellow); padding:0 .12em; margin-top:.08em; margin-left:-.12em; box-shadow:10px 10px 0 var(--ink); border:4px solid var(--ink); }
  .posts { padding:40px 0 140px; display:grid; grid-template-columns:260px 1fr; gap:48px; }
  .posts h2 { font-weight:900; font-stretch:125%; font-size:30px; text-transform:uppercase; margin:6px 0 0; }
  .posts ol { list-style:none; margin:0; padding:0; counter-reset:p; }
  .posts li { counter-increment:p; display:grid; grid-template-columns:80px 1fr; gap:12px 20px; padding:26px 0; border-bottom:4px solid var(--ink); }
  .posts li:first-child { border-top:4px solid var(--ink); }
  .posts li::before { content:counter(p, decimal-leading-zero); grid-row:span 2; font-weight:900; font-stretch:125%; font-size:44px; line-height:1; -webkit-text-stroke:2px var(--ink); color:transparent; }
  .posts a { color:var(--ink); text-decoration:none; font-size:28px; font-weight:800; line-height:1.15; }
  .posts time { font-size:14px; text-transform:uppercase; letter-spacing:.08em; }
  footer { display:flex; justify-content:space-between; padding:24px 0 36px; font-size:14px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; border-top:4px solid var(--ink); }
  footer a { color:var(--ink); }
  .d { position:absolute; z-index:1; overflow:visible; }
  .s { stroke:var(--ink); stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
</style>
</head>
<body>
<div class="page">
  <svg width="0" height="0" style="position:absolute"><defs>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="var(--ink)"/></pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3" fill="var(--ink)"/></pattern>
    <pattern id="squig" width="40" height="30" patternUnits="userSpaceOnUse"><path d="M4 10q6-8 12 0t12 0M18 24q5-7 10 0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--ink)" stroke-width="1.5"/></pattern>
  </defs></svg>

  <!-- patterned Memphis blocks + a couple of pop-colour hits -->
  <svg class="d s" style="width:620px; right:-120px; top:110px" viewBox="0 0 300 300"><rect x="2" y="2" width="296" height="296" fill="url(#grid)" stroke="none"/></svg>
  <svg class="d s" style="width:300px; right:70px; top:200px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--red)"/></svg>
  <svg class="d s" style="width:240px; right:-40px; top:390px; transform:rotate(-12deg)" viewBox="0 0 100 100"><path d="M50 4 96 92H4Z" fill="url(#stripes)"/><path d="M50 4 96 92H4Z" fill="none"/></svg>
  <svg class="d s" style="width:330px; left:300px; top:500px; transform:rotate(-4deg)" viewBox="0 0 100 85"><path d="M50 4 96 81H4Z" fill="var(--blue)"/></svg>
  <svg class="d s" style="width:200px; left:-40px; top:600px" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" fill="url(#squig)"/><rect x="4" y="4" width="92" height="92" fill="none"/></svg>
  <svg class="d" style="width:210px; left:650px; top:640px" viewBox="0 0 100 60"><rect width="100" height="60" fill="url(#dots)"/></svg>
  <svg class="d s" style="width:300px; right:60px; top:720px; transform:rotate(-6deg)" viewBox="0 0 220 50"><path d="m6 40 18-30 18 30 18-30 18 30 18-30 18 30 18-30 18 30 18-30 18 30 18-30" fill="none" stroke-width="8"/></svg>
  <svg class="d s" style="width:120px; left:20px; top:1150px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="var(--yellow)"/></svg>
  <svg class="d s" style="width:160px; right:-50px; top:1180px; transform:rotate(20deg)" viewBox="0 0 100 50"><path d="M4 46a46 46 0 0 1 92 0Z" fill="url(#stripes)"/><path d="M4 46a46 46 0 0 1 92 0Z" fill="none"/></svg>

  <div class="wrap">
    <header><a class="bb" href="#">BB</a><nav><a href="#">Writing</a><a href="#">About</a></nav></header>
    <section class="hero"><h1><span>Barnaby</span><span>Bishop</span></h1></section>
    <section class="posts">
      <h2>Writing</h2>
      <ol>
        <li><a href="#">Notes on building a tiny agent runtime</a><time>12 Nov 2026</time></li>
        <li><a href="#">An interactive example</a><time>30 Oct 2026</time></li>
        <li><a href="#">Why my homepage has a triangle on it</a><time>14 Sep 2026</time></li>
      </ol>
    </section>
    <footer><span>© 2026 Barnaby Bishop</span><a href="#">RSS</a></footer>
  </div>
</div>
</body>
</html>
