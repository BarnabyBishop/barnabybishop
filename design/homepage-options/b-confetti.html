<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option B — Confetti</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;900&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#eaf3f8; --ink:#14151a; --yellow:#ffd84a; --pink:#ff5c9a; --teal:#1fc7b6; --blue:#3a6bff; --orange:#ff8a3d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'DM Sans', system-ui, sans-serif; }
  .page { position:relative; overflow:hidden; }
  .confetti { position:absolute; inset:0; z-index:0; }
  .wrap { position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:0 64px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:36px 0; font-size:17px; font-weight:600; }
  header .mark { width:44px; height:44px; }
  header nav { display:flex; gap:12px; }
  header nav a { color:var(--ink); text-decoration:none; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:6px 18px; box-shadow:3px 3px 0 var(--ink); }
  .hero { position:relative; height:780px; display:grid; place-items:center; padding-bottom:80px; }
  h1 { position:relative; z-index:2; font-family:'Unbounded', sans-serif; font-weight:900; font-size:clamp(64px, 10.5vw, 150px); line-height:.95; letter-spacing:-.04em; text-align:center; margin:0; }
  h1 span { display:block; }
  .posts { padding:20px 0 140px; }
  .posts h2 { font-family:'Unbounded'; font-weight:900; font-size:34px; margin:0 0 36px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:32px; }
  .card { background:#fff; border:3px solid var(--ink); border-radius:18px; padding:28px; box-shadow:7px 7px 0 var(--ink); min-height:220px; display:flex; flex-direction:column; justify-content:space-between; }
  .card:nth-child(1) { transform:rotate(-1.5deg); } .card:nth-child(3) { transform:rotate(1.2deg); }
  .card .tag { width:46px; height:46px; }
  .card a { color:var(--ink); text-decoration:none; font-family:'Unbounded'; font-weight:600; font-size:23px; line-height:1.2; }
  .card time { font-size:15px; }
  footer { display:flex; justify-content:center; gap:32px; padding:28px 0 40px; font-size:15px; }
  footer a { color:var(--ink); }
  .d { position:absolute; z-index:1; overflow:visible; }
  .s { stroke:var(--ink); stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
</style>
</head>
<body>
<div class="page">
  <svg class="confetti" id="confetti" aria-hidden="true"></svg>
  <div class="wrap">
    <header>
      <svg class="mark s" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="var(--yellow)"/><path d="M11 22q4.5-8 9 0t9 0" fill="none" stroke-width="3.5"/></svg>
      <nav><a href="#">Writing</a><a href="#">About</a></nav>
    </header>
    <section class="hero">
      <!-- shapes orbiting the name -->
      <svg class="d s" style="width:300px; left:-30px; top:40px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--pink)"/></svg>
      <svg class="d s" style="width:300px; left:50%; top:470px; margin-left:-150px; transform:rotate(5deg)" viewBox="0 0 100 80"><path d="M50 4 96 76H4Z" fill="var(--yellow)"/></svg>
      <svg class="d s" style="width:360px; right:-60px; top:60px; transform:rotate(-20deg)" viewBox="0 0 220 50"><path d="M5 25q13.75-22 27.5 0t27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0" fill="none" stroke="var(--teal)" stroke-width="10"/></svg>
      <svg class="d s" style="width:170px; right:40px; top:470px; transform:rotate(12deg)" viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" fill="var(--blue)"/><path d="M6 30 30 6M6 54 54 6M6 78 78 6M18 94 94 18M42 94 94 42M66 94 94 66" stroke="#fff" stroke-width="5"/><rect x="6" y="6" width="88" height="88" fill="none"/></svg>
      <svg class="d s" style="width:110px; left:60px; top:560px" viewBox="0 0 60 140"><path d="m10 8 40 20-40 20 40 20-40 20 40 20-40 20" fill="none" stroke-width="7" transform="rotate(90 30 70)"/></svg>
      <h1><span>Barnaby</span><span>Bishop</span></h1>
    </section>
    <section class="posts">
      <h2>Writing</h2>
      <div class="grid">
        <article class="card"><svg class="tag s" viewBox="0 0 40 40"><path d="M20 4 37 34H3Z" fill="var(--yellow)"/></svg><a href="#">Notes on building a tiny agent runtime</a><time>12 Nov 2026</time></article>
        <article class="card"><svg class="tag s" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="var(--pink)"/></svg><a href="#">An interactive example</a><time>30 Oct 2026</time></article>
        <article class="card"><svg class="tag s" viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" fill="var(--teal)" transform="rotate(15 20 20)"/></svg><a href="#">Why my homepage has a triangle on it</a><time>14 Sep 2026</time></article>
      </div>
    </section>
    <footer><span>© 2026 Barnaby Bishop</span><a href="#">RSS</a></footer>
  </div>
</div>
<script>
  // deterministic confetti sprinkle (mock only)
  const svg = document.getElementById('confetti'); const ns = 'http://www.w3.org/2000/svg';
  const W = innerWidth, H = document.querySelector('.page').scrollHeight;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  const cols = ['#ff5c9a','#1fc7b6','#3a6bff','#ffd84a','#14151a'];
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60; i++) {
    const x = r() * W, y = r() * H, c = cols[Math.floor(r() * cols.length)], a = r() * 180, k = r();
    let el;
    if (k < .55) { el = document.createElementNS(ns, 'line'); el.setAttribute('x1', -9); el.setAttribute('x2', 9); el.setAttribute('stroke', c); el.setAttribute('stroke-width', 5); el.setAttribute('stroke-linecap', 'round'); }
    else if (k < .8) { el = document.createElementNS(ns, 'circle'); el.setAttribute('r', 5); el.setAttribute('fill', c); }
    else { el = document.createElementNS(ns, 'path'); el.setAttribute('d', 'M-6 -6 6 6M6 -6 -6 6'); el.setAttribute('stroke', c); el.setAttribute('stroke-width', 4); el.setAttribute('stroke-linecap', 'round'); }
    el.setAttribute('transform', `translate(${x} ${y}) rotate(${a})`); svg.appendChild(el);
  }
</script>
</body>
</html>
