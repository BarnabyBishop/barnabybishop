<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option A — Primary Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#f7f7f2; --ink:#111114; --yellow:#ffd23f; --blue:#2d5bff; --red:#ff5a4f; --teal:#14c4a2; --pink:#ff9ecb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Bricolage Grotesque', system-ui, sans-serif; }
  .page { position:relative; overflow:hidden; }
  .wrap { position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:0 64px; }
  header { display:flex; justify-content:flex-end; gap:28px; padding:36px 0; font-weight:600; font-size:18px; }
  header a { color:var(--ink); text-decoration:none; border-bottom:3px solid var(--ink); }
  h1 { font-weight:800; font-size:clamp(84px, 15vw, 210px); line-height:.86; letter-spacing:-.045em; margin:110px 0 0; }
  h1 span { display:block; }
  h1 span + span { margin-left:.55em; }
  .hero { position:relative; height:700px; }
  .posts { padding:40px 0 140px; max-width:820px; margin-left:auto; }
  .posts h2 { font-size:28px; margin:0 0 20px; }
  .posts ol { list-style:none; margin:0; padding:0; border-top:3px solid var(--ink); }
  .posts li { display:grid; grid-template-columns:150px 1fr; gap:24px; padding:22px 0; border-bottom:3px solid var(--ink); align-items:baseline; }
  .posts time { font-size:16px; }
  .posts a { color:var(--ink); text-decoration:none; font-size:30px; font-weight:800; letter-spacing:-.02em; }
  footer { display:flex; justify-content:space-between; padding:28px 0 40px; font-size:15px; }
  footer a { color:var(--ink); }
  .d { position:absolute; z-index:1; overflow:visible; }
  .s { stroke:var(--ink); stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
</style>
</head>
<body>
<div class="page">
  <!-- decorations spread across the page -->
  <svg class="d s" style="width:380px; left:70px; top:470px; transform:rotate(-9deg)" viewBox="0 0 100 90"><path d="M50 4 96 86H4Z" fill="var(--yellow)"/></svg>
  <svg class="d s" style="width:320px; right:-120px; top:130px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--blue)"/></svg>
  <svg class="d" style="width:170px; right:200px; top:120px" viewBox="0 0 100 100"><defs><pattern id="dotsA" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="var(--ink)"/></pattern></defs><rect width="100" height="100" fill="url(#dotsA)"/></svg>
  <svg class="d s" style="width:420px; right:40px; top:470px; transform:rotate(-12deg)" viewBox="0 0 220 50"><path d="M5 25q13.75-22 27.5 0t27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0" fill="none" stroke="var(--red)" stroke-width="9"/></svg>
  <svg class="d s" style="width:130px; right:300px; top:330px; transform:rotate(18deg)" viewBox="0 0 100 50"><path d="M4 46a46 46 0 0 1 92 0Z" fill="var(--teal)"/></svg>
  <svg class="d s" style="width:70px; left:48%; top:120px" viewBox="0 0 40 40"><path d="M20 4v32M4 20h32" fill="none" stroke-width="7"/></svg>
  <svg class="d s" style="width:90px; left:40px; top:980px; transform:rotate(-6deg)" viewBox="0 0 60 140"><path d="m10 8 40 20-40 20 40 20-40 20 40 20-40 20" fill="none" stroke-width="7"/></svg>
  <svg class="d s" style="width:170px; left:140px; top:1180px; transform:rotate(22deg)" viewBox="0 0 120 40"><rect x="3" y="3" width="114" height="34" fill="var(--pink)"/></svg>
  <svg class="d s" style="width:120px; right:-30px; top:900px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--blue)" stroke-width="14"/></svg>
  <svg class="d" style="width:22px; left:38%; top:600px" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="var(--red)"/></svg>
  <svg class="d" style="width:16px; left:25%; top:95px" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="var(--blue)"/></svg>
  <svg class="d s" style="width:60px; left:42%; top:760px; transform:rotate(30deg)" viewBox="0 0 40 10"><path d="M3 5h34" stroke-width="5"/></svg>

  <div class="wrap">
    <header><a href="#">Writing</a><a href="#">About</a></header>
    <section class="hero"><h1><span>Barnaby</span><span>Bishop</span></h1></section>
    <section class="posts">
      <h2>Writing</h2>
      <ol>
        <li><time>12 Nov 2026</time><a href="#">Notes on building a tiny agent runtime</a></li>
        <li><time>30 Oct 2026</time><a href="#">An interactive example</a></li>
        <li><time>14 Sep 2026</time><a href="#">Why my homepage has a triangle on it</a></li>
      </ol>
    </section>
    <footer><span>© 2026 Barnaby Bishop</span><a href="#">RSS</a></footer>
  </div>
</div>
</body>
</html>
