<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option I</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800;900&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#eaf3f8; --ink:#14151a; --card:#ffffff; --yellow:#ffd84a; --pink:#ff5c9a; --teal:#1fc7b6; --blue:#3a6bff;
          --bw:3px; --radius:12px; --shadow:6px 6px 0 var(--ink); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); }
  .page { position:relative; overflow:hidden; }
  .wrap { position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:0 64px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:26px 0; border-bottom:var(--bw) solid var(--ink); }
  header .mark { width:42px; height:42px; display:block; }
  header nav { display:flex; gap:14px; }
  header nav a { color:var(--ink); text-decoration:none; font-weight:600; font-size:16px; background:var(--card); border:var(--bw) solid var(--ink); border-radius:999px; padding:6px 18px; box-shadow:3px 3px 0 var(--ink); }
  .hero { position:relative; height:var(--hero-h, 720px); }
  h1 { position:relative; z-index:2; font-family:var(--display); margin:0; padding-top:var(--name-top, 130px); line-height:.92; }
  h1 span { display:block; width:max-content; }
  .box { border:var(--bw) solid var(--ink); border-radius:var(--radius); box-shadow:8px 8px 0 var(--ink); padding:.02em .14em .08em; margin-left:-.14em; }
  .posts { padding:20px 0 140px; }
  .posts h2 { font-family:var(--display); font-size:34px; margin:0 0 28px; }
  .card { position:relative; background:var(--card); border:var(--bw) solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card a { color:var(--ink); text-decoration:none; font-family:var(--display); font-weight:700; }
  .card time { font-size:15px; }
  footer { display:flex; justify-content:space-between; padding:24px 0 36px; font-size:15px; border-top:var(--bw) solid var(--ink); }
  footer a { color:var(--ink); }
  .d { position:absolute; z-index:1; overflow:visible; }
  .s { stroke:var(--ink); stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
 :root { --display:'Schibsted Grotesk', sans-serif; --body:'Schibsted Grotesk', sans-serif; --name-top:120px; }
  h1 { font-weight:900; font-size:clamp(68px, 11vw, 160px); letter-spacing:-.05em; }
  h1 .box { background:var(--teal); transform:rotate(-2deg); margin-bottom:.06em; }
  .posts h2 { font-weight:900; }
  .rows .card { background:var(--card); }

  .rows { list-style:none; margin:0; padding:0; display:grid; gap:20px; max-width:900px; }
  .rows .card { display:grid; grid-template-columns:140px 1fr auto; align-items:center; gap:24px; padding:22px 28px; }
  .rows a { font-size:26px; line-height:1.15; }
  .rows .arrow { font-size:26px; font-weight:700; }
</style></head>
