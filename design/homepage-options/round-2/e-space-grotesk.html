<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option E</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#eaf3f8; --ink:#14151a; --card:#ffffff; --yellow:#ffd84a; --pink:#ff5c9a; --teal:#1fc7b6; --blue:#3a6bff;
          --bw:3px; --radius:12px; --shadow:6px 6px 0 var(--ink); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); }
  .page { position:relative; overflow:hidden; }
  .wrap { position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:0 64px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:26px 0; border-bottom:var(--bw) solid var(--ink); }
  header .mark { width:42px; height:42px; display:block; }
  header nav { display:flex; gap:14px; }
  header nav a { color:var(--ink); text-decoration:none; font-weight:600; font-size:16px; background:var(--card); border:var(--bw) solid var(--ink); border-radius:999px; padding:6px 18px; box-shadow:3px 3px 0 var(--ink); }
  .hero { position:relative; height:var(--hero-h, 720px); }
  h1 { position:relative; z-index:2; font-family:var(--display); margin:0; padding-top:var(--name-top, 130px); line-height:.92; }
  h1 span { display:block; width:max-content; }
  .box { border:var(--bw) solid var(--ink); border-radius:var(--radius); box-shadow:8px 8px 0 var(--ink); padding:.02em .14em .08em; margin-left:-.14em; }
  .posts { padding:20px 0 140px; }
  .posts h2 { font-family:var(--display); font-size:34px; margin:0 0 28px; }
  .card { position:relative; background:var(--card); border:var(--bw) solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card a { color:var(--ink); text-decoration:none; font-family:var(--display); font-weight:700; }
  .card time { font-size:15px; }
  footer { display:flex; justify-content:space-between; padding:24px 0 36px; font-size:15px; border-top:var(--bw) solid var(--ink); }
  footer a { color:var(--ink); }
  .d { position:absolute; z-index:1; overflow:visible; }
  .s { stroke:var(--ink); stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
 :root { --display:'Space Grotesk', sans-serif; --body:'Space Grotesk', sans-serif; }
  h1 { font-weight:700; font-size:clamp(72px, 11.5vw, 168px); letter-spacing:-.055em; }
  h1 .box { background:var(--pink); transform:rotate(-1.5deg); margin-bottom:.12em; }
  h1 span + span { margin-left:.05em; }
 
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .cards .card { padding:26px; min-height:220px; display:flex; flex-direction:column; justify-content:space-between; gap:18px; }
  .cards .ico { width:42px; height:42px; }
  .cards a { font-size:24px; line-height:1.15; }
</style></head>
<body><div class="page"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="var(--ink)" stroke-width="2"/></pattern>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="2.6" fill="var(--ink)"/></pattern>
  <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="12" fill="var(--ink)"/></pattern>
</defs></svg>
<svg class="d s" style="width:260px; left:430px; top:590px; transform:rotate(-8deg)" viewBox="0 0 100 85"><path d="M50 4 96 81H4Z" fill="var(--yellow)"/></svg><svg class="d" style="width:300px; right:40px; top:150px" viewBox="0 0 300 240"><rect x="0" y="0" width="300" height="240" fill="url(#grid)"/></svg><svg class="d s" style="width:260px; right:-80px; top:250px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--blue)"/></svg><svg class="d" style="width:150px; left:-10px; top:560px" viewBox="0 0 150 140"><rect width="150" height="140" fill="url(#dots)"/></svg><svg class="d s" style="width:360px; right:180px; top:600px; transform:rotate(-8deg)" viewBox="0 0 220 50"><path d="M5 25q13.75-22 27.5 0t27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0 27.5 0" fill="none" stroke="var(--teal)" stroke-width="10"/></svg><svg class="d s" style="width:120px; right:420px; top:150px; transform:rotate(-15deg)" viewBox="0 0 100 50"><path d="M4 46a46 46 0 0 1 92 0Z" fill="var(--teal)"/></svg><svg class="d s" style="width:46px; left:52%; top:470px" viewBox="0 0 40 40"><path d="M20 5v30M5 20h30" fill="none" stroke="var(--ink)" stroke-width="7"/></svg><svg class="d s" style="width:150px; left:-30px; top:1150px; transform:rotate(-8deg)" viewBox="0 0 140 60"><path d="m8 50 20-40 20 40 20-40 20 40 20-40 20 40" fill="none" stroke="var(--ink)" stroke-width="7"/></svg><svg class="d s" style="width:110px; right:-30px; top:1080px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--pink)" stroke-width="14"/></svg>
<div class="wrap">
  <header><a href="#" aria-label="Home"><svg class="mark s" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="var(--yellow)"/><path d="M11 22q4.5-8 9 0t9 0" fill="none" stroke-width="3.5"/></svg></a><nav><a href="#">Writing</a><a href="#">About</a></nav></header>
  <section class="hero"><h1><span class="box">Barnaby</span><span>Bishop</span></h1></section>
  <section class="posts"><h2>Writing</h2><div class="cards"><article class="card"><svg class="ico s" viewBox="0 0 40 40"><path d="M20 4 37 34H3Z" fill="var(--yellow)"/></svg><a href="#">Notes on building a tiny agent runtime</a><time>12 Nov 2026</time></article><article class="card"><svg class="ico s" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="var(--pink)"/></svg><a href="#">An interactive example</a><time>30 Oct 2026</time></article><article class="card"><svg class="ico s" viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="4" fill="var(--teal)" transform="rotate(12 20 20)"/></svg><a href="#">Why my homepage has a triangle on it</a><time>14 Sep 2026</time></article></div></section>
  <footer><span>© 2026 Barnaby Bishop</span><a href="#">RSS</a></footer>
</div></div></body></html>
